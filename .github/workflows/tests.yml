name: tests
on: [push, pull_request]
jobs:
  dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-fund --no-audit
      - run: node tests/apply.dom.test.js
      - run: node tests/tools.dom.test.js
